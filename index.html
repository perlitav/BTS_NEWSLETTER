<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backstage — Perlhada ✦</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-primary: #2D1B3D;
            --text-secondary: #5C4B6E;
            --accent-violet: #7C3AED;
            --cta-burgundy: #7A1E3A;
            --cta-fuchsia: #D946EF;
            --glass-bg: rgba(255, 255, 255, 0.28);
            --glass-blur: 28px;
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 64px 24px 80px;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url('assets/fondo-dreamy.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        .grain-overlay {
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 9999;
        }

        /* ── HEADER ── */
        .header {
            text-align: center;
            margin-bottom: 64px;
            animation: fadeInUp 0.6s ease-out forwards;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 24px 48px -8px rgba(0, 0, 0, 0.16);
            padding: 40px 56px;
        }

        .header h1 {
            font-family: 'Anton', sans-serif;
            font-size: clamp(36px, 6vw, 72px);
            line-height: 1;
            letter-spacing: 0.02em;
            color: var(--text-primary);
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }

        .header .sub {
            font-family: 'Fraunces', serif;
            font-size: clamp(16px, 2vw, 22px);
            color: var(--text-secondary);
            margin-top: 14px;
        }

        .star {
            position: absolute;
            color: var(--accent-violet);
            font-size: 1.4rem;
            animation: twinkle 1s infinite alternate;
        }
        .star-1 { top: -10px; right: -24px; }
        .star-2 { bottom: 4px;  left: -28px; animation-delay: 0.5s; }

        @keyframes twinkle {
            0%   { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
            100% { opacity: 1;   transform: scale(1.2) rotate(45deg); }
        }

        /* ── VIDEOS ── */
        .videos-stack {
            display: flex;
            flex-direction: column;
            gap: 40px;
            width: 100%;
            max-width: 960px;
        }

        .video-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 24px 48px -8px rgba(0, 0, 0, 0.16);
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out both;
            transition: var(--transition);
        }

        .video-card:nth-child(1) { animation-delay: 0.15s; }
        .video-card:nth-child(2) { animation-delay: 0.3s; }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 32px 56px -8px rgba(124, 58, 237, 0.2);
        }

        .video-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 20px 28px 16px;
        }

        .label-tag {
            font-family: 'Anton', sans-serif;
            font-size: 13px;
            letter-spacing: 0.1em;
            color: white;
            background: linear-gradient(135deg, var(--cta-burgundy), var(--cta-fuchsia));
            padding: 4px 12px;
            border-radius: 20px;
        }

        .label-text {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
        }

        .video-wrapper video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ── FOOTER ── */
        .footer {
            margin-top: 64px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 15px;
            animation: fadeInUp 0.8s ease-out 0.45s both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            body { padding: 48px 16px 64px; }
            .header { margin-bottom: 40px; padding: 32px 28px; }
            .videos-stack { gap: 24px; }
            .video-label { padding: 16px 20px 12px; }
        }
    </style>
</head>
<body>
    <div class="grain-overlay"></div>

    <header class="header">
        <h1>
            Backstage de mi<br>proceso creativo
            <span class="star star-1">✦</span>
            <span class="star star-2">✦</span>
        </h1>
        <p class="sub">Así es como creo videos</p>
    </header>

    <div class="videos-stack">

        <div class="video-card">
            <div class="video-label">
                <span class="label-tag">BTS</span>
                <span class="label-text">El proceso</span>
            </div>
            <div class="video-wrapper">
                <video controls preload="metadata">
                    <source src="assets/0502.mp4#t=0.1" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="video-card">
            <div class="video-label">
                <span class="label-tag">RESULTADO</span>
                <span class="label-text">El video final</span>
            </div>
            <div class="video-wrapper">
                <video controls preload="metadata">
                    <source src="assets/abddce0320454ec89d111308071ade93.MP4#t=0.1" type="video/mp4">
                </video>
            </div>
        </div>

    </div>

    <footer class="footer">— Perlhada</footer>
</body>
</html>
